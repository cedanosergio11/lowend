name: restore-lowend-bundle
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/_restore/lowend-bundle.gz.b64.00"
      - "scripts/_restore/lowend-bundle.gz.b64.01"
      - "scripts/_restore/lowend-bundle.gz.b64.02"
      - "scripts/_restore/lowend-bundle.gz.b64.03"
      - "scripts/_restore/lowend-bundle.gz.b64.04"
      - "scripts/_restore/lowend-bundle.gz.b64.05"
      - "scripts/_restore/lowend-bundle.gz.b64.06"
      - "scripts/_restore/lowend-bundle.gz.b64.07"
      - "scripts/_restore/lowend-bundle.gz.b64.08"
      - "scripts/_restore/lowend-bundle.gz.b64.09"
      - "scripts/_restore/lowend-bundle.gz.b64.10"
      - "scripts/_restore/lowend-bundle.gz.b64.11"
      - "scripts/_restore/lowend-bundle.gz.b64.12"
      - "scripts/_restore/lowend-bundle.gz.b64.13"
      - "scripts/_restore/lowend-bundle.gz.b64.14"
      - "scripts/_restore/lowend-bundle.gz.b64.15"
      - "scripts/_restore/lowend-bundle.gz.b64.16"
      - "scripts/_restore/lowend-bundle.gz.b64.17"
      - "scripts/_restore/lowend-bundle.gz.b64.18"
      - "scripts/_restore/lowend-bundle.gz.b64.19"
      - "scripts/_restore/lowend-bundle.gz.b64.20"
      - "scripts/_restore/lowend-bundle.gz.b64.21"
      - "scripts/_restore/lowend-bundle.gz.b64.22"
      - "scripts/_restore/lowend-bundle.gz.b64.23"
      - "scripts/_restore/lowend-bundle.gz.b64.24"
      - ".github/workflows/restore-lowend-bundle.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode LOWEND bundle
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const zlib = require("zlib");
          const crypto = require("crypto");
          const parts = ["scripts/_restore/lowend-bundle.gz.b64.00", "scripts/_restore/lowend-bundle.gz.b64.01", "scripts/_restore/lowend-bundle.gz.b64.02", "scripts/_restore/lowend-bundle.gz.b64.03", "scripts/_restore/lowend-bundle.gz.b64.04", "scripts/_restore/lowend-bundle.gz.b64.05", "scripts/_restore/lowend-bundle.gz.b64.06", "scripts/_restore/lowend-bundle.gz.b64.07", "scripts/_restore/lowend-bundle.gz.b64.08", "scripts/_restore/lowend-bundle.gz.b64.09", "scripts/_restore/lowend-bundle.gz.b64.10", "scripts/_restore/lowend-bundle.gz.b64.11", "scripts/_restore/lowend-bundle.gz.b64.12", "scripts/_restore/lowend-bundle.gz.b64.13", "scripts/_restore/lowend-bundle.gz.b64.14", "scripts/_restore/lowend-bundle.gz.b64.15", "scripts/_restore/lowend-bundle.gz.b64.16", "scripts/_restore/lowend-bundle.gz.b64.17", "scripts/_restore/lowend-bundle.gz.b64.18", "scripts/_restore/lowend-bundle.gz.b64.19", "scripts/_restore/lowend-bundle.gz.b64.20", "scripts/_restore/lowend-bundle.gz.b64.21", "scripts/_restore/lowend-bundle.gz.b64.22", "scripts/_restore/lowend-bundle.gz.b64.23", "scripts/_restore/lowend-bundle.gz.b64.24"];
          const expected = {"scripts/grok-pwa-shared.d.mts": {"size": 3144, "md5": "444615ad327f95860e6de879c055d5a3"}, "scripts/with-app-env.mjs": {"size": 4601, "md5": "84c9c3a80bd601354c0ba8462b09532a"}, "scripts/write-atomic.mjs": {"size": 3607, "md5": "3f47493c58fcb114047546098c1fb36b"}, "scripts/sign-out-plan.mjs": {"size": 5971, "md5": "2c050be9ef3249076cff981ed041d7d8"}, "scripts/grok-pwa-plugin.mjs": {"size": 6615, "md5": "ab88fa58010ca0acda355f76e014f9cd"}, "scripts/preview.mjs": {"size": 11074, "md5": "e08809d1c95179a0669ced4c0f338ee2"}, "scripts/grok-pwa-shared.mjs": {"size": 17675, "md5": "53e4f6d4ef4cea9c1b6258585745390e"}, "src/lib/auth/client.ts": {"size": 9714, "md5": "b47004b0227955c2afebb7356e1ae05e"}, "src/lib/auth/verify.server.ts": {"size": 3874, "md5": "1f26928f133bffccc659e57c148de299"}, "src/lib/auth/isolation.server.ts": {"size": 2386, "md5": "92a878270bc40e1e697de44e71c640e7"}, "src/lib/auth/gate-identity.server.ts": {"size": 4982, "md5": "2e2d82295118a84c0d81024844b58729"}, "src/lib/auth/gate-session.server.ts": {"size": 10125, "md5": "62b907b44c9764e06bacfa3e536f1ef1"}, "src/lib/auth/pglite-dialect.ts": {"size": 4088, "md5": "d4b0fd603b6b66c540d96842693b5c63"}, "src/lib/auth/popup.server.ts": {"size": 6133, "md5": "55aa0191976fd627b7e783f6445ba1bf"}, "src/lib/auth/server.ts": {"size": 12548, "md5": "86e2a131de76f3231afd54b6ed84f626"}, "src/lib/db.ts": {"size": 9525, "md5": "1c15f83bc5c8ebfe6763339e761822d9"}, "src/lib/preview-host-bridge.ts": {"size": 8723, "md5": "be88e01b03822d1eab99e058435bcee1"}, "vite.config.ts": {"size": 7862, "md5": "4fbaa3a51c970f1f8b4f3de128e1bbf1"}, "EXPORT_NOTES.md": {"size": 2262, "md5": "e099c70e2e6f4b2656db8a5c78935cf8"}};
          const b64 = parts.map(p => fs.readFileSync(p, "utf8").trim()).join("");
          const jsonBuf = zlib.gunzipSync(Buffer.from(b64, "base64"));
          const map = JSON.parse(jsonBuf.toString("utf8"));
          let n = 0;
          for (const [rel, b64file] of Object.entries(map)) {
            const buf = Buffer.from(b64file, "base64");
            const md5 = crypto.createHash("md5").update(buf).digest("hex");
            const exp = expected[rel];
            if (!exp || exp.size !== buf.length || exp.md5 !== md5) {
              throw new Error(`bad ${rel} len=${buf.length} md5=${md5} exp=${JSON.stringify(exp)}`);
            }
            fs.mkdirSync(path.dirname(rel), { recursive: true });
            fs.writeFileSync(rel, buf);
            n++;
            console.log("ok", rel, buf.length, md5);
          }
          console.log("restored", n);
          NODE
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Restore LOWEND scaffold bundle via Actions decode"
            git push
          fi
