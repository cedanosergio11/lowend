name: Deploy GitHub Pages

# Live site is served from the gh-pages branch (build-gh-pages.yml).
# Keep this workflow manual-only so push-to-main does not leave a broken
# Actions red-X when GitHub Pages is configured for branch deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build Pages
        run: npm run build:pages
        env:
          GITHUB_PAGES: "1"
          BASE_PATH: "/lowend/"
      - name: Verify dist/client/index.html
        run: |
          if [ ! -f dist/client/index.html ]; then
            echo "dist/client/index.html missing after build:pages"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
